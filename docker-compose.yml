services:
  hpc-exporter:
    build:
      context: .
      args:
        VERSION: "1.0.0"
        INSTALL_DCGM: "true"
    image: hpc-exporter:1.0.0
    container_name: hpc-exporter
    restart: unless-stopped
    network_mode: host        # host network: /proc/net/dev and nv-hostengine on localhost:5555
    pid: host                 # host PID namespace: PBS job processes and nvidia-smi PIDs

    # nvidia-smi: the NVIDIA Container Toolkit mounts the host driver and
    # nvidia-smi into the container when runtime: nvidia is set.
    runtime: nvidia

    user: "0"
    cap_add:
      - SYS_PTRACE            # read /proc/<pid>/environ of job processes (PBS job/user/GPU mapping)
    # On hosts where SELinux labelling is enabled for Docker and job mapping
    # shows hpc_gpu_jobmap_unreadable_processes > 0, uncomment:
    # security_opt:
    #   - label=disable

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave   # statfs on host mounts (NFS, dpc, ...) via HOST_ROOT
      # Centrify binaries from the host. Uncomment only if they exist on the
      # host (`ls /usr/sbin/adinfo`); otherwise Docker creates empty dirs there.
      # - /usr/sbin/adinfo:/usr/sbin/adinfo:ro
      # - /usr/sbin/centrifydc:/usr/sbin/centrifydc:ro

    environment:
      PORT: "9009"
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host/root
      NVIDIA_ENABLED: "true"
      DCGM_ENABLED: "true"
      GPU_JOB_MAPPING: "true"
      GPU_PROCESS_METRICS: "true"
      NFS_ENABLED: "true"
      CENTRIFY_ENABLED: "true"
      PBS_ENABLED: "true"
      FS_STAT_TIMEOUT: "5s"
      # Mounts that must exist on this node group (hpc_fs_mounted=0 if missing).
      # Nodes with /scratch_aisg: add it here in their own env/compose override.
      EXPECTED_MOUNTS: "/scratch,/nfs/home/svu,/app1,/hpctmp"
      # FS_PARALLEL_TYPES: "dpc,lustre"   # extra fstypes to classify as parallel
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
