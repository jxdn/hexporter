# Recording rules for the hexporter Grafana dashboard. GENERATED by
# deploy/grafana/gen_dashboard.py rules: edit there, not here.
#
# Add to prometheus.yml, next to hexporter-alerts.yml:
#   rule_files:
#     - /etc/prometheus/rules/hexporter-recording.yml
# Check: promtool check rules hexporter-recording.yml
#        promtool test rules tests/hexporter-recording.test.yml
#
# Each minute these save small per-GPU series (hpc:*), so the dashboard reads
# one value per GPU instead of re-scanning 24 h of raw data on every refresh.
# Thresholds (0, 1, 5, 10 %) match the dashboard's "Idle if util <=" variable.
#
# hpc:gpu_last_busy:timestamp and hpc:gpu_job_since:timestamp read their own
# previous value (last_over_time [2h]), so they carry forward without limit.
# They start when the rules are first loaded, and restart if Prometheus is down
# more than 2 h. The interval must stay 1m: GPU-hours = samples / 60.
# Every rule keeps the "cluster" target label (if set), so several clusters can
# share one Prometheus.
groups:
  - name: hexporter-recording
    interval: 1m
    rules:

      # When each job got each GPU (unix time). Kept while the job holds the GPU.
      - record: hpc:gpu_job_since:timestamp
        expr: |
          (
            min by (cluster, instance, gpu_uuid, jobid) (last_over_time(hpc:gpu_job_since:timestamp[2h]))
            or
            min by (cluster, instance, gpu_uuid, jobid) (timestamp(hpc_gpu_job_info))
          )
          and on (cluster, instance, gpu_uuid, jobid) hpc_gpu_job_info

      # 1 per minute while a user's job holds the GPU. GPU-hours = sum_over_time(...) / 60.
      - record: hpc:gpu_allocated:bool
        expr: |
          count by (cluster, instance, gpu_uuid, user) (hpc_gpu_job_info) > bool 0

      # util > 0 %: last time the GPU was busy (unix time; 0 = not since the rules started).
      - record: hpc:gpu_last_busy:timestamp
        expr: |
          (
            max by (cluster, instance, gpu_uuid) (timestamp(hpc_gpu_utilization_percent > 0))
            or
            max by (cluster, instance, gpu_uuid) (last_over_time(hpc:gpu_last_busy:timestamp{threshold="0"}[2h]))
            or
            max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent * 0)
          )
          and on (cluster, instance, gpu_uuid) hpc_gpu_utilization_percent
        labels:
          threshold: "0"

      # util <= 0 %: seconds each (GPU, job) has been idle =
      # now - max(job got the GPU, GPU last busy). max(a, b) = (a + b + |a - b|) / 2.
      - record: hpc:gpu_job_idle:seconds
        expr: |
          time()
          - (
              (hpc:gpu_job_since:timestamp + on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="0"})
              + abs(hpc:gpu_job_since:timestamp - on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="0"})
            ) / 2
        labels:
          threshold: "0"

      # util <= 0 %: 1 per minute while held by a job and idle, 0 while held and busy.
      - record: hpc:gpu_allocated_idle:bool
        expr: |
          count by (cluster, instance, gpu_uuid, user) (hpc_gpu_job_info) * 0
          + on (cluster, instance, gpu_uuid) group_left ()
          (max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) <= bool 0)
        labels:
          threshold: "0"

      # util > 0 %: 0 free, 1 idle (PBS job), 2 busy outside PBS, 3 busy (PBS job).
      - record: hpc:gpu_state
        expr: |
          max by (cluster, instance, gpu_uuid, gpu_index) (hpc_gpu_utilization_percent > bool 0) * 2
          + on (cluster, instance, gpu_uuid) group_left ()
          (
            clamp_max(count by (cluster, instance, gpu_uuid) (hpc_gpu_job_info{jobid!="none"}), 1)
            or
            count by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) * 0
          )
        labels:
          threshold: "0"

      # util > 1 %: last time the GPU was busy (unix time; 0 = not since the rules started).
      - record: hpc:gpu_last_busy:timestamp
        expr: |
          (
            max by (cluster, instance, gpu_uuid) (timestamp(hpc_gpu_utilization_percent > 1))
            or
            max by (cluster, instance, gpu_uuid) (last_over_time(hpc:gpu_last_busy:timestamp{threshold="1"}[2h]))
            or
            max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent * 0)
          )
          and on (cluster, instance, gpu_uuid) hpc_gpu_utilization_percent
        labels:
          threshold: "1"

      # util <= 1 %: seconds each (GPU, job) has been idle =
      # now - max(job got the GPU, GPU last busy). max(a, b) = (a + b + |a - b|) / 2.
      - record: hpc:gpu_job_idle:seconds
        expr: |
          time()
          - (
              (hpc:gpu_job_since:timestamp + on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="1"})
              + abs(hpc:gpu_job_since:timestamp - on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="1"})
            ) / 2
        labels:
          threshold: "1"

      # util <= 1 %: 1 per minute while held by a job and idle, 0 while held and busy.
      - record: hpc:gpu_allocated_idle:bool
        expr: |
          count by (cluster, instance, gpu_uuid, user) (hpc_gpu_job_info) * 0
          + on (cluster, instance, gpu_uuid) group_left ()
          (max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) <= bool 1)
        labels:
          threshold: "1"

      # util > 1 %: 0 free, 1 idle (PBS job), 2 busy outside PBS, 3 busy (PBS job).
      - record: hpc:gpu_state
        expr: |
          max by (cluster, instance, gpu_uuid, gpu_index) (hpc_gpu_utilization_percent > bool 1) * 2
          + on (cluster, instance, gpu_uuid) group_left ()
          (
            clamp_max(count by (cluster, instance, gpu_uuid) (hpc_gpu_job_info{jobid!="none"}), 1)
            or
            count by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) * 0
          )
        labels:
          threshold: "1"

      # util > 5 %: last time the GPU was busy (unix time; 0 = not since the rules started).
      - record: hpc:gpu_last_busy:timestamp
        expr: |
          (
            max by (cluster, instance, gpu_uuid) (timestamp(hpc_gpu_utilization_percent > 5))
            or
            max by (cluster, instance, gpu_uuid) (last_over_time(hpc:gpu_last_busy:timestamp{threshold="5"}[2h]))
            or
            max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent * 0)
          )
          and on (cluster, instance, gpu_uuid) hpc_gpu_utilization_percent
        labels:
          threshold: "5"

      # util <= 5 %: seconds each (GPU, job) has been idle =
      # now - max(job got the GPU, GPU last busy). max(a, b) = (a + b + |a - b|) / 2.
      - record: hpc:gpu_job_idle:seconds
        expr: |
          time()
          - (
              (hpc:gpu_job_since:timestamp + on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="5"})
              + abs(hpc:gpu_job_since:timestamp - on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="5"})
            ) / 2
        labels:
          threshold: "5"

      # util <= 5 %: 1 per minute while held by a job and idle, 0 while held and busy.
      - record: hpc:gpu_allocated_idle:bool
        expr: |
          count by (cluster, instance, gpu_uuid, user) (hpc_gpu_job_info) * 0
          + on (cluster, instance, gpu_uuid) group_left ()
          (max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) <= bool 5)
        labels:
          threshold: "5"

      # util > 5 %: 0 free, 1 idle (PBS job), 2 busy outside PBS, 3 busy (PBS job).
      - record: hpc:gpu_state
        expr: |
          max by (cluster, instance, gpu_uuid, gpu_index) (hpc_gpu_utilization_percent > bool 5) * 2
          + on (cluster, instance, gpu_uuid) group_left ()
          (
            clamp_max(count by (cluster, instance, gpu_uuid) (hpc_gpu_job_info{jobid!="none"}), 1)
            or
            count by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) * 0
          )
        labels:
          threshold: "5"

      # util > 10 %: last time the GPU was busy (unix time; 0 = not since the rules started).
      - record: hpc:gpu_last_busy:timestamp
        expr: |
          (
            max by (cluster, instance, gpu_uuid) (timestamp(hpc_gpu_utilization_percent > 10))
            or
            max by (cluster, instance, gpu_uuid) (last_over_time(hpc:gpu_last_busy:timestamp{threshold="10"}[2h]))
            or
            max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent * 0)
          )
          and on (cluster, instance, gpu_uuid) hpc_gpu_utilization_percent
        labels:
          threshold: "10"

      # util <= 10 %: seconds each (GPU, job) has been idle =
      # now - max(job got the GPU, GPU last busy). max(a, b) = (a + b + |a - b|) / 2.
      - record: hpc:gpu_job_idle:seconds
        expr: |
          time()
          - (
              (hpc:gpu_job_since:timestamp + on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="10"})
              + abs(hpc:gpu_job_since:timestamp - on (cluster, instance, gpu_uuid) group_left () hpc:gpu_last_busy:timestamp{threshold="10"})
            ) / 2
        labels:
          threshold: "10"

      # util <= 10 %: 1 per minute while held by a job and idle, 0 while held and busy.
      - record: hpc:gpu_allocated_idle:bool
        expr: |
          count by (cluster, instance, gpu_uuid, user) (hpc_gpu_job_info) * 0
          + on (cluster, instance, gpu_uuid) group_left ()
          (max by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) <= bool 10)
        labels:
          threshold: "10"

      # util > 10 %: 0 free, 1 idle (PBS job), 2 busy outside PBS, 3 busy (PBS job).
      - record: hpc:gpu_state
        expr: |
          max by (cluster, instance, gpu_uuid, gpu_index) (hpc_gpu_utilization_percent > bool 10) * 2
          + on (cluster, instance, gpu_uuid) group_left ()
          (
            clamp_max(count by (cluster, instance, gpu_uuid) (hpc_gpu_job_info{jobid!="none"}), 1)
            or
            count by (cluster, instance, gpu_uuid) (hpc_gpu_utilization_percent) * 0
          )
        labels:
          threshold: "10"
